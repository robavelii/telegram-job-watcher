# No ports and no Caddy site: the watcher only makes outbound connections
# (Telegram MTProto, api.telegram.org, api.anthropic.com).
name: job-watcher

services:
  watcher:
    build:
      context: .
      args:
        UID: ${WATCHER_UID:-1000}   # from .env; must equal `id -u` of the config files' owner
    image: job-watcher:local
    restart: unless-stopped
    env_file: .env          # passed into the container
    volumes:
      - ./config:/app/config:ro
      - watcher-data:/data
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  watcher-data:
